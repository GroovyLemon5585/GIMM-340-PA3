<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distance Sensor Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1>Distance Sensor</h1>
        <p class="subtitle">Live data from the Arduino motion sensor</p>

        <div class="reading">
            <span id="distance">--</span>
            <span class="unit">cm</span>
        </div>

        <p id="status" class="status">Waiting for data...</p>
        <p class="updated">Last update: <span id="updated">never</span></p>
    </main>

    <script>
        const distanceEl = document.getElementById("distance");
        const statusEl = document.getElementById("status");
        const updatedEl = document.getElementById("updated");

        async function refresh() {
            try {
                const res = await fetch("/api/sensor");
                const data = await res.json();
                if (data.distance === null || data.distance === undefined) {
                    statusEl.textContent = "Waiting for data...";
                    return;
                }
                distanceEl.textContent = Number(data.distance).toFixed(1);
                statusEl.textContent = "Connected";
                updatedEl.textContent = new Date(data.time).toLocaleTimeString();
            } catch (err) {
                statusEl.textContent = "Server unreachable";
            }
        }

        refresh();
        setInterval(refresh, 1000);
    </script>
</body>
</html>
